# 창업중소기업 세액감면의 지역 구분 (조세특례제한법 제6조가 인용하는 '수도권과밀억제권역'·'인구감소지역')
# 확인일 2026-11-11. 금액이 아니라 지역 목록이다.
overcrowded:
  law_ref: "수도권정비계획법 시행령 제9조·별표 1 (시행 2025-10-01, 대통령령 제35811호, 표 원문 이미지 확인)"
  verified: true
  # 서울 전역 / 인천 중 아래 제외 지역 외 / 경기 12개 시 전체 + 남양주·시흥 일부
  seoul_all: true
  incheon_note: "인천 전역이나 강화군·옹진군, 서구 대곡동·불로동·마전동·금곡동·오류동·왕길동·당하동·원당동, 인천경제자유구역(해제 지역 포함), 남동 국가산업단지는 제외"
  gyeonggi_whole: [의정부시, 구리시, 하남시, 고양시, 수원시, 성남시, 안양시, 부천시, 광명시, 과천시, 의왕시, 군포시]
  gyeonggi_partial:
    남양주시: "호평동·평내동·금곡동·일패동·이패동·삼패동·가운동·수석동·지금동·도농동만 해당"
    시흥시: "반월특수지역(해제 지역 포함)은 제외"
pop_decline:
  law_ref: "행정안전부고시 제2026-61호 (2026-10-19) 인구감소지역 92개 중 수도권"
  verified: true
  # 감면율에서 인구감소지역이 따로 다뤄지는 곳은 수도권이므로 수도권 소속만 담는다 (비수도권은 어차피 같은 감면율).
  incheon: [강화군, 옹진군]
  gyeonggi: [가평군, 동두천시, 연천군]
  note: "인구감소관심지역(포천시 등)은 인구감소지역이 아니므로 해당하지 않음"
incheon_sigungu:
  # 시·군·구 → 구분. mixed = 일부 지역이 과밀억제권역에서 빠지므로 사업장 소재지(동·지구)를 직접 확인
  강화군: pop_decline
  옹진군: pop_decline
  동구: overcrowded
  미추홀구: overcrowded
  부평구: overcrowded
  계양구: overcrowded
  남동구: mixed          # 남동 국가산업단지 제외
  서구: mixed            # 일부 동·경제자유구역 제외
  중구: mixed            # 경제자유구역(영종 등) 제외
  연수구: mixed          # 경제자유구역(송도 등) 제외
gyeonggi_other: [용인시, 화성시, 파주시, 김포시, 양주시, 포천시, 이천시, 광주시, 여주시, 양평군, 안성시, 평택시, 오산시, 안산시]
