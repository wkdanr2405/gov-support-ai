disaster_loss:          # 재해손실세액공제 (법인)
  law_ref: "법인세법 제58조 (시행 2026-01-01, 법률 제21217호), 시행령 제95조"
  verified: true         # 법 제58조 요건·산식·한도. 시행령 세부는 아래 unverified_parts
  checked_at: "2026-11-07"
  evidence: "국가법령정보센터 법 제58조 조회(요지) + 국세청 보도참고자료(2025-03-31) 계산 사례 + 상공회의소 안내문 3곳의 요건·산식 일치. 조문 전문(원문 그대로) 열람은 못 함"
  min_loss_ratio:
    value: 0.2           # 상실 자산이 자산총액의 20% 이상
    law_ref: "법 제58조 제1항"
    verified: true
  cap:
    value: "공제액은 재해로 상실된 자산가액을 한도로 한다"
    law_ref: "법 제58조 제1항"
    verified: true
  taxes_covered:
    value: "(가) 재해발생일 현재 부과되지 않았거나 부과되었으나 납부하지 않은 법인세(가산세 포함) (나) 재해발생일이 속한 사업연도의 법인세(가산세 포함, 법인세법 외 법률의 공제·감면세액 제외). 각각 재해상실비율을 곱함"
    law_ref: "법 제58조 제1항 제1호·제2호"
    verified: true
  filing:
    value: "납세지 관할 세무서장에게 신청. 원칙 재해발생일부터 3개월, 아직 신고기한 전인 법인세는 그 신고기한(재해일부터 3개월 미만이면 3개월)"
    law_ref: "법 제58조 제2항, 시행령 제95조"
    verified: false
  unverified_parts:      # 시행령 원문 확인 전. 국세청 자료 기준으로만 계산에 반영
    - "상실 자산가액·총자산가액의 범위: 재해일 현재 장부가액, 토지 제외, 보험금은 차감하지 않음 (시행령 제95조)"
    - "'납세가 곤란하다고 인정'되는지는 세무서장의 판단이라 코드로 판정하지 않음"
    - "가산세 포함 범위(무신고·과소신고·납부지연 등)"

