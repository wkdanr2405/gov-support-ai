integrated_employment:   # 통합고용세액공제
  law_ref: "조세특례제한법 제29조의8 제1항 (시행 2026-09-18), 시행령 제26조의8"
  verified: true
  checked_at: "2026-11-01"
  evidence: "국가법령정보센터 법 제29조의8·시행령 제26조의8 조회 + KPMG 2025 세제개편 요약 등 교차"
  years: 3                       # 1차·2차·3차 연도 단가가 정해져 있음
  # 증가 인원 1명당 금액. 리스트 = [1차연도, 2차연도, 3차연도]
  sme:
    capital_area:                # 수도권
      youth_etc: [700, 1600, 1700]
      other:     [400, 900, 1000]
    non_capital_area:            # 수도권 밖
      youth_etc: [1000, 1900, 2000]
      other:     [700, 1200, 1300]
  applies_to_tax_years:
    value: "2026.12.31이 속하는 과세연도부터 2028.12.31이 속하는 과세연도까지"
    law_ref: "법 제29조의8 제1항"
    verified: true
  increase_cap:
    value: "청년등·청년등외 상시근로자 증가 인원은 각각 전체 상시근로자 증가 인원을 한도로 한다"
    law_ref: "법 제29조의8 제1항 제1호·제2호"
    verified: true
  min_increase_required:
    value: "중소기업은 최소고용증가인원수 요건 없음 (중견 5명, 그 외 10명 초과분만 공제)"
    law_ref: "법 제29조의8 제1항 단서, 시행령 제26조의8 제3항"
    verified: true
  youth_definition:
    value: "만 15~34세. 병역 이행자는 6년 한도로 병역 기간을 뺀 나이로 계산. 근로계약 체결 당시 34세 이하면 34세를 넘겨도 중소·중견 4년(그 외 3년) 청년으로 봄. 장애인, 계약일 현재 60세 이상, 경력단절근로자, 북한이탈주민도 청년등. 기간제·단시간·파견근로자 등은 연령 기준 청년에서 제외"
    law_ref: "시행령 제26조의8 제4항 제1호~제5호"
    verified: true
  regular_worker_definition:
    value: "근로기준법상 근로계약을 맺은 내국인. 제외: 근로기간 1년 미만, 월평균 60시간 미만 단시간근로자, 임원, 최대주주(대표자)와 그 배우자·직계존비속·친족, 원천징수·국민연금·건강보험 납부 확인이 안 되는 자"
    law_ref: "시행령 제26조의8 제2항"
    verified: true
  clawback:
    value: "상시근로자 수가 줄어도 공제액을 추징하는 규정은 현행 조문(제1항~제9항)에 없음. 개별 근로관계 종료 시 추징은 정규직 전환·육아휴직 복귀자 공제(제4·5·7항)에만 있음"
    law_ref: "법 제29조의8"
    verified: true
  later_year_effect_of_decrease:
    value: "법 제29조의8 제1항 제1호·제2호의 계산식 A+B+C로 확인: A=해당연도 수에서 직전연도 수를 뺀 증가 인원, B=해당·직전연도 중 적은 수에서 전전연도 수를 뺀 인원, C=해당·직전·전전연도 중 가장 적은 수에서 전전전연도 수를 뺀 인원에 각 금액을 곱하고 음수는 0. 인원이 줄면 B·C가 그만큼 줄어든다. 엔진은 증가한 인원이 3년간 유지된다고 가정"
    law_ref: "법 제29조의8 제1항 제1호·제2호 (계산식, 2026-11-11 법 원문 대조)"
    verified: true

