- id: rnd_increase_blocked_by_avg
  desc: 직전 과세연도 발생액이 4년 연평균보다 적으면 증가분 방식 불가 → 당기분
  input:
    region: capital
    employees_prev: 10
    employees_curr: 10
    youth_prev: 0
    youth_curr: 0
    rnd_curr: 20000
    rnd_prev: 5000
    rnd_prev4_avg: 8000
  expect:
    employment_by_year:
    - 0
    - 0
    - 0
    rnd_credit: 5000
    rnd_method: current
- id: rnd_prev_zero
  desc: 직전 과세연도 발생 없음 → 당기분만
  input:
    region: capital
    employees_prev: 10
    employees_curr: 10
    youth_prev: 0
    youth_curr: 0
    rnd_curr: 10000
    rnd_prev: 0
    rnd_prev4_avg: 0
  expect:
    employment_by_year:
    - 0
    - 0
    - 0
    rnd_credit: 2500
    rnd_method: current
- id: rnd_avg_unknown
  desc: 직전 4년 연평균을 모르면 증가분 방식을 검토할 수 없어 당기분만
  input:
    region: capital
    employees_prev: 10
    employees_curr: 10
    youth_prev: 0
